# property.xpertbid.com → Next.js (PM2 on 127.0.0.1:3000)
# Install: symlink into /etc/nginx/sites-available and enable.
# TLS: certbot --nginx -d property.xpertbid.com

server {
    listen 80;
    listen [::]:80;
    server_name property.xpertbid.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name property.xpertbid.com;

    # ssl_certificate     /etc/letsencrypt/live/property.xpertbid.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/property.xpertbid.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
