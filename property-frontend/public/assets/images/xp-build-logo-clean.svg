<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 91" width="540" height="91" fill="none">
  <!-- Xpert Build Clean Outline Icon (Option 1: Modern Architectural Building) -->
  <g transform="translate(4, 0)">
    <!-- Antenna / Spire -->
    <line x1="60" y1="4" x2="60" y2="14" stroke="#74c7f4" stroke-width="7" stroke-linecap="round" />
    <!-- Main Architectural Towers -->
    <path d="M 10 83 L 10 32 L 38 32 L 38 14 L 82 14 L 82 83 Z" stroke="#74c7f4" stroke-width="7" stroke-linejoin="round" />
    <!-- Entrance Door -->
    <path d="M 52 83 L 52 64 L 68 64 L 68 83" stroke="#74c7f4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Tower Windows -->
    <rect x="47" y="26" width="8" height="8" fill="#74c7f4" rx="1" />
    <rect x="67" y="26" width="8" height="8" fill="#74c7f4" rx="1" />
    <rect x="47" y="44" width="8" height="8" fill="#74c7f4" rx="1" />
    <rect x="67" y="44" width="8" height="8" fill="#74c7f4" rx="1" />
    <!-- Side Wing Windows -->
    <rect x="20" y="46" width="8" height="7" fill="#74c7f4" rx="1" />
    <rect x="20" y="62" width="8" height="7" fill="#74c7f4" rx="1" />
  </g>

  <!-- Typography: 100% matching Xpert Property & Xpert Vehicle -->
  <text x="128" y="72" font-family="Arial, 'Helvetica Neue', Inter, sans-serif" font-size="74" font-weight="bold" letter-spacing="-0.5">
    <tspan fill="#43ace9">Xpert</tspan>
    <tspan dx="28" fill="#23262f">Build</tspan>
  </text>
</svg>

