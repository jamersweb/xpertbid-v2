# Self-hosted RTMP ingest -> HLS (480p-friendly: no server-side transcode; set OBS to 480p)
# Stream URL:   rtmp://YOUR_SERVER_IP:1935/live/STREAM_KEY
# Playback URL: http://YOUR_SERVER_IP:8899/hls/STREAM_KEY.m3u8
#
worker_processes auto;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            allow publish all;
            allow play all;
            record off;

            hls on;
            hls_path /tmp/hls;
            hls_fragment 3;
            hls_playlist_length 30;
            hls_continuous on;
            hls_cleanup on;
            hls_sync 100ms;
        }
    }
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout combined;
    sendfile      on;
    tcp_nopush    on;

    server {
        listen 8080;
        server_name _;

        # HLS segments + playlist (CORS for browser players on another port/domain)
        location /hls/ {
            alias /tmp/hls/;
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
        }

        location = /health {
            default_type text/plain;
            return 200 "ok\n";
        }

        location = / {
            default_type text/plain;
            return 200 "XpertBid streaming demo\nIngest: rtmp://HOST:1935/live/YOUR_STREAM_KEY\nPlay:  http://HOST:8899/hls/YOUR_STREAM_KEY.m3u8\n";
        }
    }
}
